[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "okf-loremaster"
# Read from `__init__.py` rather than written twice. The CLI prints `__version__`, so a
# static value here is a second place to bump and a release that lies about itself.
dynamic = ["version"]
description = "Multi-agent extraction of structured, verified biomedical evidence from PubMed/PMC into an Open Knowledge Format bundle — for downstream feature construction, engineering, and selection."
readme = "README.md"
requires-python = ">=3.11,<3.13"
# SPDX expression, not a `License ::` classifier: PEP 639 supersedes those, and declaring both is
# what makes a build back-end complain.
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["pubmed", "pmc", "okf", "open-knowledge-format", "literature", "rag", "biomedical"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "litellm>=1.44",
    "langgraph>=1.0",
    "langgraph-checkpoint-sqlite>=2.0",
    "platformdirs>=4.2",
]

[project.urls]
Homepage = "https://github.com/PFreda-Lab/okf-loremaster"
Repository = "https://github.com/PFreda-Lab/okf-loremaster"

[project.optional-dependencies]
# Kept out of the base install: chromadb + sentence-transformers pull onnxruntime and torch.
# The OKF bundle is the primary product; the vector index is derived and optional.
vectors = ["chromadb>=0.5", "sentence-transformers>=3.0"]
tui = ["textual>=0.70"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "mypy>=1.10",
    "ruff>=0.5",
    "types-PyYAML>=6.0",
    "build>=1.2",
    "twine>=5.1",
]
all = ["okf-loremaster[vectors,tui]"]

[project.scripts]
# Canonical name used in all documentation.
okf-loremaster = "okf_loremaster.cli:app"
# Short alias for interactive use. Same app; not referenced in docs.
loremaster = "okf_loremaster.cli:app"

[tool.hatch.version]
path = "src/okf_loremaster/__init__.py"

# Hatchling already omits anything the VCS ignores, which is what keeps `.env`, `bundles/`
# and the working notes out of a build. Naming `.env` again costs nothing and means a
# secret is not one edit to `.gitignore` away from being published. Anchored, so the
# `.env.example` template beside it is untouched.
[tool.hatch.build]
exclude = ["/.env"]

[tool.hatch.build.targets.wheel]
packages = ["src/okf_loremaster"]

# The template is one file at the repo root, edited there and shipped from there. A
# checkout has it beside `pyproject.toml`; a `pip install` has no checkout, so the wheel
# carries the same bytes as package data and `init` falls back to them. Renamed on the
# way in: inside the package a leading dot would read as a real dotfile.
[tool.hatch.build.targets.wheel.force-include]
".env.example" = "okf_loremaster/env.example"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# This project lives in a OneDrive folder. Tool caches are rewritten on every run
# and would sync continuously, so keep all three outside the synced directory.
cache-dir = "~/.cache/okf-loremaster/ruff"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
# `tests/` is not a package, so pytest puts it on the path and its helpers import as
# bare top-level modules. Named here, they sort into their own block instead of being
# mistaken for a third-party dependency.
known-local-folder = ["fake_llm", "fake_ncbi", "graph_runs"]

# `ruff format` is a gate alongside `ruff check`, and everything it decides is a default —
# double quotes, `line-length` above, the magic trailing comma honored. None of it is a
# preference worth having; the point is that no review comment is ever spent on any of it.
#
# The one line here is load-bearing. This codebase reasons in its docstrings, and they are
# full of things that look like code and are not: `x[nosuchfield]`, `\\{part}`, half a YAML
# block. Letting the formatter parse and rewrite those would edit prose, which is the one
# thing it must not touch. Off is the default; it is written down because it is the only
# setting anyone would be tempted to flip.
[tool.ruff.format]
docstring-code-format = false

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
warn_unreachable = true
cache_dir = "~/.cache/okf-loremaster/mypy"

# Third-party packages that ship no type information.
[[tool.mypy.overrides]]
module = ["litellm.*", "chromadb.*", "sentence_transformers.*", "langgraph.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
cache_dir = "~/.cache/okf-loremaster/pytest"
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning:okf_loremaster.*"]
